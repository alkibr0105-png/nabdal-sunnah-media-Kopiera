name: Daglig hadith-post

on:
  # GitHub räknar i UTC. 16:00 och 17:00 UTC täcker 18:00 svensk tid både sommar- och vintertid;
  # steget "Tidskontroll" släpper bara igenom körningen när klockan i Stockholm är 18 eller senare,
  # och post.rb publicerar aldrig mer än ett inlägg per dag.
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = skapa bild utan att publicera, publish = publicera på riktigt'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v4

      - name: Tidskontroll
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%H)" -lt 18 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Klockan är $(date +%H:%M) i Stockholm – väntar på nästa körning."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typsnitt och verktyg
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core imagemagick >/dev/null

      - name: Skapa och publicera
        if: steps.gate.outputs.run == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "dry-run" ]; then
            ruby post.rb --dry-run
          else
            ruby post.rb
          fi

      - name: Spara förhandsbild
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: bild
          path: out/*.jpg
          if-no-files-found: ignore

      - name: Spara posted.log
        if: steps.gate.outputs.run == 'true' && github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        run: |
          git config user.name "nabd-alsunnah-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.log
          git diff --cached --quiet && exit 0
          git commit -m "posted.log $(date +%F)"
          git pull --rebase --quiet
          git push
